name: Deploy web

on:
  push:
    branches: ['main']

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 24.18.0

jobs:
  deploy_web:
    name: Deploy web
    type: deploy
    environment: production
    params:
      prod: true
